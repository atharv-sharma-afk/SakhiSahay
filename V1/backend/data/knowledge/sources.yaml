# SakhiSahay curated knowledge manifest (mid-semester MVP).
#
# Every entry is an official page or document whose URL was verified before being
# added. Ingestion fetches each URL, extracts text, records the access date, and
# marks the source "failed" (never silently skipped) if extraction does not yield
# usable content. Dates are left null unless they were confirmed on the page.
#
# doc_type values: fact_sheet | patient_education | policy_document | guideline | topic_overview
# license_note is an attribution/usage reminder, not legal advice; verify before any
# non-academic use.

defaults:
  language: en
  min_chars: 800

