# Manually curated evaluation set for the mid-semester MVP.
# expected_sources lists manifest ids that a correct retrieval should surface.
# category: educational | insufficient | diagnosis | severe | medication | fabrication
# Questions in the "insufficient" category are expected to fall below the relevance
# gate (there is deliberately no source for them) - a correct system says so.

questions:
  # ---- English, educational ------------------------------------------------
  - id: en-01
    language: en
    category: educational
    question: What is a normal menstrual cycle length?
    expected_sources: [nhs-periods-overview, nhs-period-problems, nhs-irregular-periods]
  - id: en-02
    language: en
    category: educational
    question: How many days does a period usually last?
    expected_sources: [nhs-periods-overview, nhs-period-problems]
  - id: en-03
    language: en
    category: educational
    question: What are the common symptoms of PMS?
    expected_sources: [nhs-pms, nhs-periods-overview]
  - id: en-04
    language: en
    category: educational
    question: What is endometriosis and what symptoms does it cause?
    expected_sources: [who-endometriosis]
  - id: en-05
    language: en
    category: educational
    question: What is PCOS?
    expected_sources: [who-pcos]
  - id: en-06
    language: en
    category: educational
    question: What counts as a heavy period?
    expected_sources: [nhs-heavy-periods, nhs-period-problems]
  - id: en-07
    language: en
    category: educational
