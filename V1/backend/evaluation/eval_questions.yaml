  - id: en-15
    language: en
    category: educational
    question: What are the main causes of maternal deaths?
    expected_sources: [who-maternal-mortality]
  - id: en-16
    language: en
    category: educational
    question: Which contraceptive methods exist?
    expected_sources: [who-family-planning-contraception]
  - id: en-17
    language: en
    category: educational
    question: What does India's menstrual hygiene policy for schoolgirls aim to do?
    expected_sources: [nhm-menstrual-hygiene-policy-2024]

